    <circle cx="60" cy="60" r="54" fill="none" stroke="#f5b82e" stroke-width="2"/>
    <circle cx="60" cy="60" r="46" fill="none" stroke="#f5f2e9"/>
    <circle cx="60" cy="60" r="40" fill="#f5f2e9"/>
    <path id="ring" d="M18 66a44 44 0 0 1 84 0" fill="none"/>
    <text fill="#f5b82e" font-family="Consolas,monospace" font-size="11" letter-spacing="3"><textPath href="#ring" startOffset="50%" text-anchor="middle">RAMPA</textPath></text>
    <path d="M36 70h30l7-14h14" fill="none" stroke="#f5b82e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M40 70v7h34" fill="none" stroke="#111714" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="49" cy="79" r="3.4" fill="#111714"/>
    <circle cx="68" cy="79" r="3.4" fill="#111714"/>
  </g>
  <text x="171" y="100" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="600" letter-spacing="-1.5" fill="#f5f2e9">rampa</text>
  <text x="1136" y="95" text-anchor="end" font-family="Consolas,monospace" font-size="13" letter-spacing="1.3" fill="#b7bfb5">PENTRU CEI CARE ȚIN FLOTA ÎN MIȘCARE.</text>
  <text x="64" y="220" font-family="Consolas,monospace" font-size="13" letter-spacing="2" fill="#f5b82e">MAI PUȚINĂ BIROCRAȚIE. MAI MULT DRUM.</text>
  <g font-family="Georgia,serif" font-size="77" letter-spacing="-3.5">
