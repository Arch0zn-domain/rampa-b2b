    <text x="60" y="415" fill="#f5b82e" font-style="italic">CMR-ul pleacă.</text>
  </g>
  <text x="64" y="485" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#b7bfb5">CMR-uri pentru flote cu 5–50 de camioane.</text>
  <g transform="translate(845 203) rotate(8 145 160)">
    <rect width="275" height="313" fill="#28312b" stroke="#f5b82e" stroke-opacity=".6"/>
