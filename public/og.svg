  <text x="84" y="592" font-family="Consolas,monospace" font-size="13" letter-spacing="1.1" fill="#b7bfb5">GÂNDIT PENTRU TRANSPORTATORII DIN ROMÂNIA</text>
  <text x="1136" y="592" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#f5f2e9">rampa-mea.vercel.app ↗</text>
