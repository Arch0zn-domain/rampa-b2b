<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Rampa — CMR-uri pentru flote cu 5–50 de camioane</title>
  <desc>Comanda intră. CMR-ul pleacă. O fișă de transport pe fundal verde închis, alături de sigiliul Rampa.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#f5f2e9" stroke-opacity=".035"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#111714"/>
  <rect x="720" width="480" height="630" fill="url(#grid)"/>
  <path d="M64 158H1136M64 550H1136" stroke="#f5f2e9" stroke-opacity=".17"/>
  <g transform="translate(62 42) scale(.76)">
